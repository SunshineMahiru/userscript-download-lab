name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # npm ci 使用提交在库里的锁文件，依赖版本与本地一致。
      # --no-audit 与本地保持一致：审计摘要要额外访问一个端点，那条链路断了
      # 会让安装本身失败，而审计并不是这一步要验的东西。
      # npm ci installs from the committed lockfile. --no-audit keeps CI identical to
      # local runs: the audit summary needs an extra endpoint, and its failure would
      # take down the install for something this step is not checking.
      - run: npm ci --no-audit --no-fund
      # 产物与源码的逐字节校验在测试内完成，忘记重建会让这一步失败。
      # The byte-level artifact check runs inside the suite; a missed rebuild fails here.
      - run: npm test
      # 失败时把 FAIL 行与随后几行折成注解。本机读不到 Actions 日志，
      # 注解是唯一能离线看到失败原因的地方，因此长期保留。
      # On failure, fold the FAIL lines into annotations. This machine cannot read job
      # logs, so annotations are the only place the reason is visible; it stays.
      - name: Diagnose failing tests
        if: failure()
        run: |
          npm test 2>&1 | grep -A 6 '^FAIL' | head -30 | sed 's/%/%25/g' | while IFS= read -r line; do
            echo "::error::${line}"
          done
